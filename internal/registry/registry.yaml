version: 1

tools:
  - id: claude-code
    label: Claude Code
    homepage: https://docs.claude.com/en/docs/claude-code
    paths:
      - { path: ~/.claude, category: cache, risk: safe, note: "sessions + cache, jaro covers cleanup" }
      - { path: ~/.claude/projects, category: transcripts, risk: archive, note: "JSONL transcripts" }
      - { path: ~/.claude/transcripts, category: transcripts, risk: archive }
      - { path: ~/.claude.json, category: config, risk: never, note: "main config" }
    macos_paths:
      - { path: ~/Library/Application Support/Claude, category: cache, risk: safe }
      - { path: ~/Library/Caches/Claude, category: cache, risk: safe }

  - id: codex-cli
    label: Codex CLI
    homepage: https://github.com/openai/codex
    paths:
      - { path: ~/.codex, category: cache, risk: safe }
      - { path: ~/.codex/sessions, category: sessions, risk: archive, note: "session history; archive before delete" }
      - { path: ~/.codex/archived_sessions, category: sessions, risk: archive }
      - { path: ~/.codex/thread_history_1.sqlite, category: sessions, risk: manual, note: "thread history SQLite" }
      - { path: ~/.codex/logs_2.sqlite, category: logs, risk: archive }
    macos_paths:
      - { path: ~/Library/Application Support/Codex, category: cache, risk: safe }
      - { path: ~/Library/Application Support/com.openai.chat, category: cache, risk: safe }

  - id: cursor
    label: Cursor
    homepage: https://www.cursor.com
    paths:
      - { path: ~/.cursor, category: cache, risk: safe }
      - { path: ~/.cursor/extensions, category: cache, risk: safe, note: "reinstallable" }
      - { path: ~/.cursor/ai-tracking, category: logs, risk: manual }
      - { path: ~/.cursor/worktrees, category: cache, risk: safe }
    macos_paths:
      - { path: ~/Library/Application Support/Cursor, category: cache, risk: safe }
      - { path: ~/Library/Application Support/Cursor/snapshots, category: snapshots, risk: manual, note: "time-travel snapshots" }
      - { path: ~/Library/Application Support/Cursor/logs, category: logs, risk: safe }
      - { path: ~/Library/Caches/Cursor, category: cache, risk: safe }

  - id: windsurf
    label: Windsurf
    homepage: https://codeium.com/windsurf
    paths:
      - { path: ~/.windsurf, category: cache, risk: safe }
      - { path: ~/.windsurf/extensions, category: cache, risk: safe }
    macos_paths:
      - { path: ~/Library/Application Support/Windsurf, category: cache, risk: safe }
      - { path: ~/Library/Caches/Windsurf, category: cache, risk: safe }

  - id: trae
    label: Trae
    homepage: https://www.trae.ai
    paths:
      - { path: ~/.trae, category: cache, risk: safe }
      - { path: ~/.trae/extensions, category: cache, risk: safe }
    macos_paths:
      - { path: ~/Library/Application Support/Trae, category: cache, risk: safe }
      - { path: ~/Library/Application Support/Trae/logs, category: logs, risk: archive }

  - id: antigravity
    label: Antigravity
    paths:
      - { path: ~/.gemini, category: cache, risk: safe }
      - { path: ~/.gemini/antigravity, category: cache, risk: safe }
    macos_paths:
      - { path: ~/Library/Application Support/Antigravity, category: cache, risk: safe }

  - id: copilot-cli
    label: GitHub Copilot CLI
    paths:
      - { path: ~/.copilot, category: cache, risk: safe }

  - id: huggingface
    label: Hugging Face
    paths:
      - { path: ~/.cache/huggingface, category: models, risk: manual }

  - id: continue
    label: Continue
    paths:
      - { path: ~/.continue, category: config, risk: never, note: "extension config" }

  - id: llm
    label: Simon Willison llm
    paths: []
    macos_paths:
      - { path: ~/Library/Application Support/io.datasette.llm, category: cache, risk: manual }

  - id: openai-desktop
    label: OpenAI Desktop
    macos_paths:
      - { path: ~/Library/Application Support/OpenAI, category: cache, risk: safe }

  - id: chatgpt-desktop
    label: ChatGPT Desktop
    macos_paths:
      - { path: ~/Library/Application Support/com.openai.chat, category: cache, risk: safe }

  - id: lm-studio
    label: LM Studio
    paths:
      - { path: ~/.lmstudio, category: models, risk: manual, note: "delegate to LM Studio UI" }
    macos_paths:
      - { path: ~/Library/Application Support/lm-studio, category: models, risk: manual }
      - { path: ~/Library/Application Support/LM Studio, category: models, risk: manual }

  - id: ollama
    label: Ollama
    paths:
      - { path: ~/.ollama, category: models, risk: manual, note: "delegate to ollama rm" }
